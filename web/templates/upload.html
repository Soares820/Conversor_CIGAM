{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block conteudo %}
<div class="page-head glass-panel">
  <h1>Envie a planilha do cliente</h1>
  <p>Aceita .xlsx, .xls, .csv ou .tsv. Na próxima etapa você escolhe a tabela CIGAM de destino.</p>
</div>

<div class="card">
  <form method="post" action="{{ url_for('enviar') }}" enctype="multipart/form-data">
    <div class="field">
      <label for="cliente">Planilha do cliente *</label>
      <div class="dropzone" data-dropzone>
        <input type="file" id="cliente" name="cliente" accept=".xlsx,.xls,.csv,.tsv" required>
        <label for="cliente" class="dropzone-inner">
          {{ icon("upload-cloud") }}
          <span class="dropzone-title">Arraste o arquivo aqui</span>
          <span class="dropzone-sub">ou clique para selecionar</span>
          <span class="dropzone-file" data-filename hidden>{{ icon("check-circle") }}<span data-filename-text></span></span>
        </label>
      </div>
    </div>

    <button type="button" class="advanced-toggle" data-advanced-toggle>
      {{ icon("chevron-right") }} Usar um modelo CIGAM diferente do padrão
    </button>
    <div class="advanced-panel" data-advanced-panel>
      <div class="field">
        <label for="modelo">Modelo CIGAM (opcional)</label>
        <div class="dropzone" data-dropzone>
          <input type="file" id="modelo" name="modelo" accept=".xlsx">
          <label for="modelo" class="dropzone-inner">
            {{ icon("upload-cloud") }}
            <span class="dropzone-title">Arraste o gabarito aqui</span>
            <span class="dropzone-sub">se não enviar, usa o gabarito padrão do projeto</span>
            <span class="dropzone-file" data-filename hidden>{{ icon("check-circle") }}<span data-filename-text></span></span>
          </label>
        </div>
      </div>
    </div>

    <div class="actions-row">
      <button type="submit" class="btn btn-primary" data-loading-text="Enviando...">
        Continuar {{ icon("arrow-right") }}
      </button>
    </div>
  </form>
</div>
{% endblock %}
